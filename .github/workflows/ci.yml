name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api-quality-check:
    name: API (Lint, Typecheck & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install API Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint API
        run: npm run lint

      - name: Typecheck API
        run: npx tsc --noEmit

      - name: Run API Automated Tests with Coverage
        run: npm run test:coverage

      - name: Build API
        run: npm run build

  client-quality-check:
    name: Client (Lint, Typecheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci

      - name: Lint Client
        run: npm run lint

      - name: Typecheck Client
        run: npx tsc --noEmit

      - name: Build Client
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_sample
