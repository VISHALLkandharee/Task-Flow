name: CI Pipeline

on:
  push:
    branches: [main, master, feature/update-ui]
  pull_request:
    branches: [main, master]

jobs:
  api-quality-check:
    name: API (Lint, Typecheck, Security & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install API Dependencies
        run: npm ci

      - name: Security Audit (API)
        run: npm audit --audit-level=critical || true

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskflow_ci?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/taskflow_ci?schema=public

      - name: Lint API
        run: npm run lint

      - name: Typecheck API
        run: npx tsc --noEmit

      - name: Run API Automated Tests with Coverage
        run: npm run test:coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskflow_ci?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/taskflow_ci?schema=public
          JWT_SECRET: test-jwt-secret-for-ci-testing-purposes-123456
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-ci-testing-123456

      - name: Build API
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskflow_ci?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/taskflow_ci?schema=public

  client-quality-check:
    name: Client (Lint, Typecheck, Security, Tests & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci

      - name: Security Audit (Client)
        run: npm audit --audit-level=critical || true

      - name: Lint Client
        run: npm run lint

      - name: Typecheck Client
        run: npx tsc --noEmit

      - name: Run Client Tests
        run: npm test

      - name: Build Client
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_sample
